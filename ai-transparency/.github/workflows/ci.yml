name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Profiles tests
        run: |
          cd services/profiles
          npm ci
          npm test
      - name: Reviews tests
        run: |
          cd services/reviews
          npm ci
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Benchmarks tests
        run: |
          pip install -r services/benchmarks/requirements.txt
          pytest services/benchmarks/test_main.py
      - name: Analytics tests
        run: |
          pip install -r services/analytics/requirements.txt
          pytest services/analytics/test_analytics_main.py
      - name: Contract tests
        run: |
          pip install jsonschema
          pytest tests/contract/test_benchmark_schema.py


  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install UI deps
        run: |
          cd packages/ui
          npm ci
      - name: Install Playwright browsers
        run: |
          cd packages/ui
          npx playwright install --with-deps chromium
      - name: Build Storybook
        run: |
          cd packages/ui
          npm run build-storybook
      - name: Run visual regression
        run: |
          cd packages/ui
          npx http-server storybook-static -p 6006 &
          sleep 5
          npm run test:visual
