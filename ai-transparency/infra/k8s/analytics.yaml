apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
spec:
  replicas: 1
  selector:
    matchLabels: { app: analytics }
  template:
    metadata:
      labels: { app: analytics }
    spec:
      containers:
        - name: analytics
          image: your-registry/analytics:latest
          ports:
            - containerPort: 6000
          envFrom:
            - configMapRef: { name: ai-transparency-config }
            - secretRef: { name: ai-transparency-secret }
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
spec:
  selector: { app: analytics }
  ports:
    - port: 6000
      targetPort: 6000
