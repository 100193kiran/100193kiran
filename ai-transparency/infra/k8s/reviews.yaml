apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews
spec:
  replicas: 1
  selector:
    matchLabels: { app: reviews }
  template:
    metadata:
      labels: { app: reviews }
    spec:
      containers:
        - name: reviews
          image: your-registry/reviews:latest
          ports:
            - containerPort: 4100
6000
          envFrom:
            - configMapRef: { name: ai-transparency-config }
            - secretRef: { name: ai-transparency-secret }
---
apiVersion: v1
kind: Service
metadata:
  name: reviews
spec:
  selector: { app: reviews }
  ports:
    - port: 4100
6000
      targetPort: 4100
6000
